name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ ref で新しい実行が始まったら、古い実行は止める。ただし main は止めない
# （続けてマージしたとき、どのコミットにも CI の結果が残るように）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 実機（Raspberry Pi OS Bookworm）は 3.11。下限として 3.9 も検証する。
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 構文チェック
        run: python -m compileall -q chime campus_chime.py scripts tests

      - name: ユニットテスト
        run: python -m unittest discover -s tests -t . -v

      # 12 時の時報は天気（Open-Meteo）を取りに行くため、実際の通信をしない
      # よう、天気を無効にした設定を渡す。
      - name: CLI が起動すること
        run: |
          python campus_chime.py --version
          python campus_chime.py --schedule 3
          python campus_chime.py --test-hourly 12 --dry-run --backend mock \
            --config tests/fixtures/offline_config.json

  lint:
    name: pyflakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 版を固定するのは、pyflakes の更新で新しい指摘が増え、関係のない変更の
      # CI が突然赤くなるのを防ぐため。上げるときは手元でも同じ版で確認する。
      - name: pyflakes をインストール
        run: python -m pip install pyflakes==4.0.0

      - name: 未使用の import や未定義の名前がないこと
        run: python -m pyflakes chime scripts tests campus_chime.py

  shell:
    name: シェルスクリプト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 構文チェック
        run: bash -n scripts/setup.sh
      - name: shellcheck
        run: shellcheck scripts/setup.sh

  prerecorded-only:
    name: 作り置きだけで全文言を賄えること（音声合成エンジンなし）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # このランナーには VOICEVOX ENGINE も open_jtalk も無く、何も追加導入
      # しない。つまり「合成エンジンが一つも使えない」状態がそのまま再現できる。
      # v5.0.0 で実行時合成へのフォールバック（旧 open_jtalk）を廃したため、
      # この状態で 1 文でも作り置き（assets/voice/）に無いと、その文だけ
      # 無音になり、chime.sequence._append_speech が警告を出す
      # （「◯◯を合成できませんでした: …」）。全文言が作り置きで賄えている
      # ことを、この警告が 1 件も出ないことで確認する。
      - name: 全文言（時刻アナウンス・ひとこと・天気）が作り置きだけで合成できること
        run: |
          python -c "
          from chime.config import load_config
          from chime.phrases import collect_phrases
          config = load_config()
          for phrase in collect_phrases(config, include_quotes=True):
              print(phrase)
          " > /tmp/phrases.txt
          echo "検証する文言数: $(wc -l < /tmp/phrases.txt)"

          : > /tmp/tts_output.log
          while IFS= read -r phrase; do
            python campus_chime.py --say "$phrase" --dry-run --backend mock \
              >> /tmp/tts_output.log 2>&1
          done < /tmp/phrases.txt

          if grep -q "を合成できませんでした" /tmp/tts_output.log; then
            echo "作り置きだけでは合成できない文言がありました:"
            grep -B2 "を合成できませんでした" /tmp/tts_output.log
            exit 1
          fi
          echo "全 $(wc -l < /tmp/phrases.txt) 件の文言が作り置きだけで合成できました。"
