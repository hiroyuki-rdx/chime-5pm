name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 実機（Raspberry Pi OS Bookworm）は 3.11。下限として 3.9 も検証する。
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 構文チェック
        run: python -m compileall -q chime campus_chime.py scripts tests

      - name: ユニットテスト
        run: python -m unittest discover -s tests -t . -v

      - name: CLI が起動すること
        run: |
          python campus_chime.py --version
          python campus_chime.py --schedule 3
          python campus_chime.py --test-hourly 12 --dry-run --backend mock

  shell:
    name: シェルスクリプト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 構文チェック
        run: bash -n scripts/setup.sh
      - name: shellcheck
        run: shellcheck scripts/setup.sh

  prerecorded-only:
    name: 作り置きだけで全文言を賄えること（音声合成エンジンなし）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # このランナーには VOICEVOX ENGINE も open_jtalk も無く、何も追加導入
      # しない。つまり「合成エンジンが一つも使えない」状態がそのまま再現できる。
      # v5.0.0 で実行時合成へのフォールバック（旧 open_jtalk）を廃したため、
      # この状態で 1 文でも作り置き（assets/voice/）に無いと、その文だけ
      # 無音になり、chime.sequence._append_speech が警告を出す
      # （「◯◯を合成できませんでした: …」）。全文言が作り置きで賄えている
      # ことを、この警告が 1 件も出ないことで確認する。
      - name: 全文言（時刻アナウンス・ひとこと・天気）が作り置きだけで合成できること
        run: |
          python -c "
          import sys
          from chime.config import load_config
          sys.path.insert(0, 'scripts')
          from generate_voicevox import collect_phrases
          config = load_config()
          for phrase in collect_phrases(config, include_quotes=True):
              print(phrase)
          " > /tmp/phrases.txt
          echo "検証する文言数: $(wc -l < /tmp/phrases.txt)"

          : > /tmp/tts_output.log
          while IFS= read -r phrase; do
            python campus_chime.py --say "$phrase" --dry-run --backend mock \
              >> /tmp/tts_output.log 2>&1
          done < /tmp/phrases.txt

          if grep -q "を合成できませんでした" /tmp/tts_output.log; then
            echo "作り置きだけでは合成できない文言がありました:"
            grep -B2 "を合成できませんでした" /tmp/tts_output.log
            exit 1
          fi
          echo "全 $(wc -l < /tmp/phrases.txt) 件の文言が作り置きだけで合成できました。"
